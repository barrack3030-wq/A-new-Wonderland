backend:
  name: github
  repo: barrack3030-wq/A-new-Wonderland
  branch: main

local_backend: true

media_folder: "public/images"
public_folder: "/images"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

i18n:
  structure: multiple_folders
  locales: [id, en, es, fr, zh]
  default_locale: id

collections:
  - name: "destinations"
    label: "Destinations"
    folder: "src/content/destinations"
    create: true
    i18n: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Description", name: "description", widget: "text", i18n: true}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false, i18n: true}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false, i18n: true}
      - {label: "Image", name: "image", widget: "image", i18n: true}
      - {label: "Image Alt", name: "imageAlt", widget: "string", required: false, i18n: true}
      - {label: "Location", name: "location", widget: "string", i18n: true}
      - {label: "Category", name: "category", widget: "select", options: ["Beach", "Waterfall", "Island", "Lake", "Hill", "Cave", "Bay", "Culture"], i18n: true}
      - {label: "Highlights", name: "highlights", widget: "list", required: false, i18n: true}
      - {label: "Activities", name: "activities", widget: "list", required: false, i18n: true}
      - {label: "Best Time to Visit", name: "bestTime", widget: "string", required: false, i18n: true}
      - {label: "Travel Tips", name: "travelTips", widget: "list", required: false, i18n: true}
      - {label: "Body", name: "body", widget: "markdown", i18n: true}

  - name: "packages"
    label: "Tour Packages"
    folder: "src/content/packages"
    create: true
    i18n: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Description", name: "description", widget: "text", i18n: true}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false, i18n: true}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false, i18n: true}
      - {label: "Image", name: "image", widget: "image", i18n: true}
      - {label: "Image Alt", name: "imageAlt", widget: "string", required: false, i18n: true}
      - {label: "Duration", name: "duration", widget: "string", i18n: true}
      - {label: "Destination Coverage", name: "destination", widget: "string", i18n: true}
      - {label: "Activities", name: "activities", widget: "list", required: false, i18n: true}
      - {label: "Included", name: "included", widget: "list", required: false, i18n: true}
      - {label: "Excluded", name: "excluded", widget: "list", required: false, i18n: true}
      - label: "Itinerary"
        name: "itinerary"
        widget: "list"
        required: false
        i18n: true
        fields:
          - {label: "Day", name: "day", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
      - {label: "Body Overview", name: "body", widget: "markdown", i18n: true}

  # Blog is intentionally split into five independent collections.
  # This keeps Sveltia compatible with the existing translated filenames
  # while the AI CMS continues to generate all five language files directly.
  - name: "blog_id"
    label: "Blog — Indonesia"
    folder: "src/content/blog/id"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Image Alt", name: "imageAlt", widget: "string", required: false}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Image Source", name: "imageSource", widget: "hidden", required: false}
      - {label: "Translation Key", name: "translationKey", widget: "hidden", required: false}

  - name: "blog_en"
    label: "Blog — English"
    folder: "src/content/blog/en"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Image Alt", name: "imageAlt", widget: "string", required: false}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Image Source", name: "imageSource", widget: "hidden", required: false}
      - {label: "Translation Key", name: "translationKey", widget: "hidden", required: false}

  - name: "blog_es"
    label: "Blog — Español"
    folder: "src/content/blog/es"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Image Alt", name: "imageAlt", widget: "string", required: false}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Image Source", name: "imageSource", widget: "hidden", required: false}
      - {label: "Translation Key", name: "translationKey", widget: "hidden", required: false}

  - name: "blog_fr"
    label: "Blog — Français"
    folder: "src/content/blog/fr"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Image Alt", name: "imageAlt", widget: "string", required: false}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Image Source", name: "imageSource", widget: "hidden", required: false}
      - {label: "Translation Key", name: "translationKey", widget: "hidden", required: false}

  - name: "blog_zh"
    label: "Blog — 中文"
    folder: "src/content/blog/zh"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Image Alt", name: "imageAlt", widget: "string", required: false}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "SEO Title", name: "seoTitle", widget: "string", required: false}
      - {label: "SEO Description", name: "seoDescription", widget: "text", required: false}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Image Source", name: "imageSource", widget: "hidden", required: false}
      - {label: "Translation Key", name: "translationKey", widget: "hidden", required: false}
