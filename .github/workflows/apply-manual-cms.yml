name: Apply manual multilingual CMS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'CMS: apply manual multilingual workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository
        run: echo "Manual multilingual CMS patch workflow is ready."
