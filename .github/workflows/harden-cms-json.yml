name: Harden CMS JSON API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Markdown frontmatter
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          # Quote frontmatter scalars containing YAML-significant punctuation.
          # Article bodies are not touched.
          for path in Path('src/content').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  continue
              end = text.find('\n---', 4)
              if end < 0:
                  continue
              frontmatter = text[4:end]
              lines = frontmatter.splitlines()
              changed = False
              out = []
              for line in lines:
                  match = re.match(r'^(\\s*[A-Za-z][A-Za-z0-9_-]*:\\s*)(.+?)\\s*$', line)
                  if not match:
                      out.append(line)
                      continue
                  prefix, value = match.groups()
                  stripped = value.strip()
                  if (stripped.startswith(('"', "'", '[', '{')) or
                      stripped in ('', 'null', 'true', 'false') or
                      stripped.startswith('- ')):
                      out.append(line)
                      continue
                  if ':' in stripped or '|' in stripped or '#' in stripped or stripped.startswith(('http://', 'https://')):
                      out.append(prefix + json.dumps(stripped, ensure_ascii=False))
                      changed = True
                  else:
                      out.append(line)
              if changed:
                  path.write_text('---\n' + '\n'.join(out) + text[end:], encoding='utf-8')
                  print(f'Normalized {path}')

      - name: Commit normalization changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content
          if git diff --cached --quiet; then
            echo 'No frontmatter normalization changes needed.'
            exit 0
          fi
          git commit -m 'fix: normalize Markdown frontmatter YAML'
          git push
