name: Patch CMS translator to OpenAI

on:
  push:
    paths:
      - '.github/workflows/patch-cms-openai.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Google Apps Script CMS
        shell: python
        run: |
          from pathlib import Path

          path = Path('google-apps-script/Code.gs')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "const GEMINI_MODEL='gemini-3.6-flash';\nconst GEMINI_FALLBACK_MODEL='gemini-3.5-flash-lite';\nconst GEMINI_URL_BASE='https://generativelanguage.googleapis.com/v1beta/models/';\nconst GEMINI_URL=GEMINI_URL_BASE+GEMINI_MODEL+':generateContent';",
              "const OPENAI_MODEL='gpt-5.6-luna';\nconst OPENAI_URL='https://api.openai.com/v1/responses';"
            ),
            (
              "function getGeminiConfig(){\n  const key=PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY');\n  if(!key)throw new Error('GEMINI_API_KEY belum diset di Script Properties.');\n  return {provider:'gemini',key:key,model:GEMINI_MODEL,url:GEMINI_URL,fallbackModel:GEMINI_FALLBACK_MODEL};\n}",
              "function getOpenAIConfig(){\n  const key=PropertiesService.getScriptProperties().getProperty('OPENAI_API_KEY');\n  if(!key)throw new Error('OPENAI_API_KEY belum diset di Script Properties.');\n  return {provider:'openai',key:key,model:OPENAI_MODEL,url:OPENAI_URL};\n}"
            ),
            ("const cfg=getGeminiConfig();", "const cfg=getOpenAIConfig();"),
            ("throw new Error('Gemini error ['+lang+'] ('+status+'): '+raw);", "throw new Error('OpenAI error ['+lang+'] ('+status+'): '+raw);"),
            (
              "function translatorRequest(cfg,source,targetLanguage){\n  const payload=buildTranslationPayload(cfg,source,targetLanguage);\n  let url=cfg.url+'?key='+encodeURIComponent(cfg.key);\n  return {url:url,method:'post',contentType:'application/json',headers:{},payload:JSON.stringify(payload),muteHttpExceptions:true};\n}",
              "function translatorRequest(cfg,source,targetLanguage){\n  const payload=buildTranslationPayload(cfg,source,targetLanguage);\n  return {url:cfg.url,method:'post',contentType:'application/json',headers:{Authorization:'Bearer '+cfg.key},payload:JSON.stringify(payload),muteHttpExceptions:true};\n}"
            ),
            (
              "function buildTranslationPayload(cfg,source,targetLanguage){\n  const prompt=buildTranslationPrompt(source,targetLanguage);\n  return {contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}};\n}",
              "function buildTranslationPayload(cfg,source,targetLanguage){\n  const prompt=buildTranslationPrompt(source,targetLanguage);\n  return {model:cfg.model,input:[{role:'user',content:[{type:'input_text',text:prompt}]}],text:{format:{type:'json_object'}},temperature:0.2,store:false};\n}"
            ),
            (
              "function aiRequestResilient(cfg,payload,label){\n  let lastRaw='',lastStatus=0;\n  for(let attempt=1;attempt<=MAX_RETRIES;attempt++){\n    const result=rawAiFetch(cfg,payload);\n    if(result.status>=200&&result.status<300){\n      let data;try{data=JSON.parse(result.raw);}catch(e){throw new Error(label+': Respons AI tidak valid.');}\n      return {data:data,status:result.status};\n    }\n    lastRaw=result.raw;lastStatus=result.status;\n    if(!isTransientStatus(result.status)||attempt===MAX_RETRIES)break;\n    const delay=Math.min(30000,Math.pow(2,attempt-1)*1200+Math.floor(Math.random()*800));\n    Utilities.sleep(delay);\n  }\n  const fallback={provider:'gemini',key:cfg.key,model:GEMINI_FALLBACK_MODEL,url:GEMINI_URL_BASE+GEMINI_FALLBACK_MODEL+':generateContent',fallbackModel:''};\n  for(let attempt=1;attempt<=MAX_RETRIES;attempt++){\n    const result=rawAiFetch(fallback,payload);\n    if(result.status>=200&&result.status<300){\n      let data;try{data=JSON.parse(result.raw);}catch(e){throw new Error(label+': Respons AI fallback tidak valid.');}\n      return {data:data,status:result.status};\n    }\n    lastRaw=result.raw;lastStatus=result.status;\n    if(!isTransientStatus(result.status)||attempt===MAX_RETRIES)break;\n    const delay=Math.min(30000,Math.pow(2,attempt-1)*1200+Math.floor(Math.random()*800));\n    Utilities.sleep(delay);\n  }\n  throw new Error(label+' error ('+lastStatus+'): '+lastRaw);\n}\n\nfunction rawAiFetch(cfg,payload){\n  let url=cfg.url;\n  const options={method:'post',contentType:'application/json',headers:{},payload:JSON.stringify(payload),muteHttpExceptions:true};\n  if(cfg.provider==='gemini')url+='?key='+encodeURIComponent(cfg.key);\n  const r=UrlFetchApp.fetch(url,options);\n  return {status:r.getResponseCode(),raw:r.getContentText()};\n}",
              "function aiRequestResilient(cfg,payload,label){\n  let lastRaw='',lastStatus=0;\n  for(let attempt=1;attempt<=MAX_RETRIES;attempt++){\n    const result=rawAiFetch(cfg,payload);\n    if(result.status>=200&&result.status<300){\n      let data;try{data=JSON.parse(result.raw);}catch(e){throw new Error(label+': Respons OpenAI tidak valid.');}\n      return {data:data,status:result.status};\n    }\n    lastRaw=result.raw;lastStatus=result.status;\n    if(!isTransientStatus(result.status)||attempt===MAX_RETRIES)break;\n    const delay=Math.min(30000,Math.pow(2,attempt-1)*1200+Math.floor(Math.random()*800));\n    Utilities.sleep(delay);\n  }\n  throw new Error(label+' error ('+lastStatus+'): '+lastRaw);\n}\n\nfunction rawAiFetch(cfg,payload){\n  const options={method:'post',contentType:'application/json',headers:{Authorization:'Bearer '+cfg.key},payload:JSON.stringify(payload),muteHttpExceptions:true};\n  const r=UrlFetchApp.fetch(cfg.url,options);\n  return {status:r.getResponseCode(),raw:r.getContentText()};\n}"
            )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected CMS code block was not found; aborting without changes.')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          meta = Path('metadata.json')
          if meta.exists():
              m = meta.read_text(encoding='utf-8')
              m = m.replace('MAJOR_CAPABILITY_SERVER_SIDE_GEMINI_API', 'MAJOR_CAPABILITY_SERVER_SIDE_OPENAI_API')
              meta.write_text(m, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          grep -q "OPENAI_API_KEY" google-apps-script/Code.gs
          grep -q "gpt-5.6-luna" google-apps-script/Code.gs
          grep -q "api.openai.com/v1/responses" google-apps-script/Code.gs
          if grep -q "GEMINI_API_KEY" google-apps-script/Code.gs; then
            echo 'Gemini reference still exists in CMS Code.gs'
            exit 1
          fi

      - name: Commit CMS changes and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-apps-script/Code.gs metadata.json
          git rm .github/workflows/patch-cms-openai.yml
          git commit -m 'feat: switch CMS translator to OpenAI'
          git push