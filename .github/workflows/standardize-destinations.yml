name: Standardize Destination Articles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/standardize-destination-articles.mjs'

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rewrite English and Indonesian destination articles
        run: node scripts/standardize-destination-articles.mjs
      - name: Commit generated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/destinations/en src/content/destinations/id
          if git diff --cached --quiet; then
            echo "No article changes needed."
          else
            git commit -m "Standardize destination articles [skip ci]"
            git push
          fi
