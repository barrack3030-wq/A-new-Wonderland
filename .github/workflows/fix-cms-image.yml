name: Fix CMS featured image duplication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix featured image handling
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/cms/index.astro')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"function attachImageToContent\(content,img,alt\)\{.*?\}\n\n"
              r"function ensureAllArticleImages\(\)\{.*?\n\}\n",
              re.S,
          )

          replacement = '''function ensureAllArticleImages(){
            if(!translatedArticles||!selectedImage||!selectedImage.url)return;
            Object.keys(translatedArticles).forEach(function(lang){
              const article=translatedArticles[lang];
              if(article){
                // Featured image is stored only in frontmatter/metadata.
                // Do NOT inject it into article.content; that creates a second photo.
                article.image=selectedImage.url;
                article.imageAlt=article.imageAlt||selectedImage.alt||titleEl.value||'Banggai Wonderland';
                article.imageSource=article.imageSource||selectedImage.source||'';
              }
            });
          }
          '''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Target CMS image functions not found; no changes made.')

          new_text = new_text.replace(
              'Foto otomatis ditempel ke 5 versi artikel.',
              'Featured image digunakan sebagai satu-satunya foto utama pada 5 versi artikel.'
          )
          path.write_text(new_text, encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-cms-image.yml
          git add src/pages/cms/index.astro
          git commit -m 'Fix CMS duplicate featured image when using tags'
          git push
